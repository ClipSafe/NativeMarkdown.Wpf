name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build NativeMarkdown.Wpf.sln -c Release

      - name: Test
        run: dotnet test NativeMarkdown.Wpf.sln -c Release --no-build

      - name: Pack
        run: dotnet pack src/NativeMarkdown.Wpf/NativeMarkdown.Wpf.csproj -c Release --no-build -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
